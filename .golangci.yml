version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - misspell
    - revive
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
      - linters:
          - misspell
        text: "passivedns"
      - path: pkg/config/config_test\.go
        linters:
          - staticcheck
        text: "SA1019"

formatters:
  enable:
    - gofmt
    - goimports
