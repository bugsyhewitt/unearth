version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - misspell
    - revive
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
      - linters:
          - misspell
        text: "passivedns"

formatters:
  enable:
    - gofmt
    - goimports
